[package]
name = "stream-assist"
version = "0.1.0"
description = "Stream Assist — музыка по наградам Twitch"
authors = []
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "stream_assist_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rusqlite = { version = "0.38", features = ["bundled"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
obws = "0.14"
sha2 = "0.10"
base64 = "0.22"
rand = "0.9"
include_dir = "0.7"
zip = "6"
url = "2"
thiserror = "2"
anyhow = "1"
futures-util = "0.3"
supertonic3-tts = "=1.3.0"
# supertonic3-tts 1.3.0 требует ort ^2.0.0-rc.12, но rc.14+ ломает API; rc.13 — версия из lock-файла крейта
ort = "=2.0.0-rc.13"
ndarray = "0.17"
hound = "3.5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
wiremock = "0.6"
tower = { version = "0.5", features = ["util"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
