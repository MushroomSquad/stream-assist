<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stream Assist — Glass</title><link rel="stylesheet" href="/widget/theme/glass/style.css"></head>
<body><main id="widget" hidden><div class="cov"><span id="note">♪</span><img id="cover" alt="Обложка" hidden></div>
<div class="info"><div class="t" id="title"></div><div class="a" id="artist"></div>
<div class="by" id="requester"></div><div class="prog"><i id="progress"></i></div></div>
<div class="q" id="queue"></div></main><div id="sa-youtube"></div>
<script src="/widget/sdk.js"></script><script>
const el = id => document.getElementById(id);
let trackId, nextId;
StreamAssist.on('state', state => {
  StreamAssist.show(el('widget'), state.visible);
  const now = state.now;
  el('title').textContent = now?.track.title || '';
  el('artist').textContent = now?.track.artist || '';
  el('requester').textContent = now ? 'заказал: @' + now.requester : '';
  const cover = el('cover'), url = now?.track.cover_url;
  cover.hidden = !url; el('note').hidden = !!url;
  cover.onerror = () => { cover.hidden = true; el('note').hidden = false; };
  if (url && cover.getAttribute('src') !== url) cover.src = url;
  if (!url) cover.removeAttribute('src');
  const duration = now?.track.duration_ms;
  StreamAssist.progress(el('progress'), Math.min(100, Math.max(0, state.progress_ms / (duration || Infinity) * 100)), now?.id);
  const next = state.queue[0];
  if (next?.id !== nextId) StreamAssist.replay(el('queue'), 'sa-enter');
  nextId = next?.id;
  el('queue').textContent = next ? 'Далее: ' + next.track.artist + ' — ' + next.track.title + (state.queue.length > 1 ? ' · ещё ' + (state.queue.length - 1) : '') : '';
  if (now?.id != null && now.id !== trackId) {
    StreamAssist.replay(document.querySelector('.info'), 'sa-new');
    StreamAssist.replay(document.querySelector('.cov'), 'sa-new');
  }
  trackId = now?.id;
});
</script></body></html>
