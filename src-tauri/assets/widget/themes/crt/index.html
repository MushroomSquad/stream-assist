<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stream Assist — Crt</title><link rel="stylesheet" href="/widget/theme/crt/style.css"></head>
<body><main id="widget" hidden><div class="cov"><span id="note">♪</span><img id="cover" alt="Обложка" hidden></div>
<div class="info"><div id="time"><span id="mode"></span><span class="cur">_</span><span id="clock"></span><span id="time-static"></span></div><div class="t" id="title"></div><div class="a" id="artist"></div>
<div class="by" id="requester"></div><div class="prog"><i id="progress"></i></div></div>
<div class="q" id="queue"></div></main><div id="sa-youtube"></div>
<script src="/widget/sdk.js"></script><script>
const el = id => document.getElementById(id);
let trackId, typing;
function title(text) {
  clearTimeout(typing);
  const target = el('title');
  target.textContent = text;
  if (!text || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const letters = Array.from(text), typed = document.createTextNode(''), ghost = document.createElement('span');
  ghost.className = 'ghost'; ghost.textContent = text;
  target.replaceChildren(typed, ghost);
  let index = 0;
  const step = () => {
    typed.textContent += letters[index++];
    ghost.textContent = letters.slice(index).join('');
    if (index < letters.length) typing = setTimeout(step, Math.min(28, 1200 / letters.length));
    else target.textContent = text;
  };
  typing = setTimeout(step, Math.min(28, 1200 / letters.length));
}
StreamAssist.on('state', state => {
  StreamAssist.show(el('widget'), state.visible);
  const now = state.now;
  const changed = now?.id != null && now.id !== trackId;
  if (changed || now?.id !== trackId) title(now?.track.title || '');
  trackId = now?.id;
  el('artist').textContent = now?.track.artist || '';
  el('requester').textContent = now ? 'by @' + now.requester : '';
  const cover = el('cover'), url = now?.track.cover_url;
  cover.hidden = !url; el('note').hidden = !!url;
  cover.onerror = () => { cover.hidden = true; el('note').hidden = false; };
  if (url && cover.getAttribute('src') !== url) cover.src = url;
  if (!url) cover.removeAttribute('src');
  const duration = now?.track.duration_ms;
  StreamAssist.progress(el('progress'), state.progress_ms / (duration || Infinity) * 100, now?.id);
  if (changed) {
    StreamAssist.replay(document.querySelector('.info'), 'sa-new');
  }
  const time = ms => { const seconds = Math.floor(Math.max(0, ms) / 1000); return String(Math.floor(seconds / 60)).padStart(2, '0') + ':' + String(seconds % 60).padStart(2, '0'); };
  el('mode').textContent = '> ' + state.mode.toUpperCase();
  el('clock').textContent = ' ' + time(state.progress_ms) + '/' + (duration ? time(duration) : '--:--');
  el('time-static').textContent = el('mode').textContent + '_' + el('clock').textContent;
  StreamAssist.list(el('queue'), state.queue, item => item.id, (item, index) => {
    const row = document.createElement('div');
    const number = document.createElement('span'); number.textContent = '[' + (index + 1) + ']';
    const track = document.createElement('span'); track.textContent = item.track.artist + ' — ' + item.track.title;
    row.append(number, track); return row;
  });
});
</script></body></html>
