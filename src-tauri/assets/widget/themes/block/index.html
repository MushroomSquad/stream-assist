<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stream Assist — Block</title><link rel="stylesheet" href="/widget/theme/block/style.css"></head>
<body><main id="widget" hidden><div class="cov"><span id="note">♪</span><img id="cover" alt="Обложка" hidden></div>
<div class="info"><div class="t" id="title"></div><div class="credits"><span class="a" id="artist"></span><span class="by" id="requester"></span></div><div class="prog"><i id="progress"></i></div></div>
<div class="q" id="queue"></div></main><div id="sa-youtube"></div>
<script src="/widget/sdk.js"></script><script>
const el = id => document.getElementById(id);
StreamAssist.on('state', state => {
  el('widget').hidden = !state.visible;
  const now = state.now;
  el('title').textContent = now?.track.title || '';
  el('artist').textContent = now?.track.artist || '';
  el('requester').textContent = now ? '@' + now.requester : '';
  const cover = el('cover'), url = now?.track.cover_url;
  cover.hidden = !url; el('note').hidden = !!url;
  cover.onerror = () => { cover.hidden = true; el('note').hidden = false; };
  if (url && cover.getAttribute('src') !== url) cover.src = url;
  if (!url) cover.removeAttribute('src');
  const duration = now?.track.duration_ms;
  el('progress').style.width = Math.min(100, Math.max(0, state.progress_ms / (duration || Infinity) * 100)) + '%';
  const next = state.queue[0];
  el('queue').textContent = next ? 'NEXT ▸ ' + next.track.artist + ' — ' + next.track.title : '';
});
</script></body></html>
